[project]
name = "wearmind-api"
version = "0.1.0"
description = "WearMind FastAPI 后端"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
